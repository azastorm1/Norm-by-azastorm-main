<title>Norm by Azastorm</title>
<meta name="description" content="Norm by Azastorm — стритвир под заказ: принт и вышивка, свои дизайны.">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;800&family=Inter:wght@400;600;800&family=Montserrat:wght@400;700;900&family=Unbounded:wght@400;700&family=Russo+One&family=Bebas+Neue&family=Oswald:wght@400;700&family=Playfair+Display:wght@400;700&family=Cormorant+Garamond:wght@400;700&family=Righteous&family=Bowlby+One&family=Rubik+Mono+One&family=Pacifico&family=Lobster&family=Marck+Script&family=Caveat:wght@400;700&family=Comfortaa:wght@400;700&family=Mrs+Saint+Delafield&display=swap">
<link rel="stylesheet" href="/style.css">
</head>
<body>
<header>
  <a class="logo" href="#top">Norm<small>by Azastorm</small></a>
  <nav>
    <a class="go" href="#collection" data-i18n="nav_coll"></a>
    <a class="go" id="navGal" href="#gallery" data-i18n="nav_gallery" hidden></a>
    <a class="go" href="#builder" data-i18n="nav_build"></a>
    <span class="lang" id="lang"><button data-l="ru">RU</button><button data-l="uz">UZ</button><button data-l="en">EN</button></span>
  </nav>
</header>

  <p class="lead" data-i18n="hero_lead"></p>

<section class="pad" id="look" hidden><div class="wrap">
  <h2 class="sec" data-i18n="look_title"></h2>
  <div class="look" id="lookList"></div>
</div></section>

<section class="pad alt" id="gallery" hidden><div class="wrap">
  <h2 class="sec" data-i18n="gal_title"></h2>
  <p class="sub" data-i18n="gal_sub"></p>
  <div class="gal" id="gal"></div>
</div></section>

<section class="pad" id="builder"><div class="wrap">
  <h2 class="sec" data-i18n="b_title"></h2>
  <p class="sub" data-i18n="b_sub"></p>
  <div class="builder">
    <div class="stage"><svg id="tee" viewBox="0 0 200 200" role="img"></svg></div>
    <div class="ctl">
      <div><h3 id="hColor" data-i18n="color"></h3><div class="chips" data-k="color"></div><label class="cpick"><span id="hCustom"></span><input type="color" id="ccol" value="#16213a"></label></div>
      <div><h3 id="hItem"></h3><div class="chips" data-k="item"></div></div>
      <div id="row-zip" hidden><h3 id="hZip"></h3><div class="chips" data-k="zip"></div></div>
      <div id="row-cuff" hidden><h3 id="hCuff"></h3><div class="chips" data-k="cuff"></div></div>
      <div><h3 data-i18n="kind"></h3><div class="chips" data-k="kind"></div></div>
      <div><h3 data-i18n="place"></h3><div class="chips" data-k="place"></div></div>
      <div><h3 data-i18n="art"></h3><div class="chips" data-k="mode"></div></div>
      <div class="panel" id="p-text"><input type="text" id="txt" maxlength="30" value="Norm" data-i18n-aria="text_aria"><p class="note" id="thint"></p><div class="trow"><select id="font"></select><input type="color" id="tcol" value="#c0344d"></div></div>
      <div class="panel" id="p-photo" hidden><input type="file" id="file" accept="image/*" data-i18n-aria="photo_aria"><p class="note" data-i18n="photo_note"></p></div>
      <div class="panel" id="p-ref" hidden><textarea class="d" id="desc" maxlength="600" data-i18n-ph="ref_desc"></textarea><input type="url" id="ref" maxlength="300" data-i18n-ph="ref_link"><button type="button" class="mini" id="refBtn" data-i18n="ref_btn"></button><p class="refmsg" id="refMsg" role="status"></p><p class="note" data-i18n="ref_note"></p></div>
      <div class="panel" id="p-design" hidden><p class="note"><span data-i18n="chosen"></span> <b id="dname"></b>. <a href="#gallery" data-i18n="other"></a></p></div>
      <div class="panel"><h3 style="margin:0" data-i18n="adjust"></h3>
        <label class="rng"><span data-i18n="scale"></span><input type="range" id="sc" min="40" max="170" value="100"><output id="o-sc"></output></label>
        <label class="rng"><span data-i18n="mx"></span><input type="range" id="dx" min="-40" max="40" value="0"><output id="o-dx"></output></label>
        <label class="rng"><span data-i18n="my"></span><input type="range" id="dy" min="-40" max="40" value="0"><output id="o-dy"></output></label>
        <button class="mini" id="reset" data-i18n="reset"></button>
      </div>
      <div><h3 data-i18n="tee_size"></h3><div class="chips" data-k="size"></div></div>
      <div class="price" id="price"></div>
      <a class="btn" href="#order" data-i18n="to_order"></a>
    </div>
  </div>
</div></section>

<section class="pad order" id="order"><div class="wrap grid">
  <div>
    <h2 class="sec" data-i18n="o_title"></h2>
    <p class="sub" data-i18n="o_sub"></p>
    <form id="form" novalidate>
      <label><span data-i18n="name"></span><input type="text" id="fName" autocomplete="name" maxlength="80"></label>
      <label><span data-i18n="phone"></span><input type="tel" id="fPhone" autocomplete="tel" placeholder="+998" maxlength="30"></label>
      <label><span data-i18n="city"></span><input type="text" id="fCity" maxlength="120"></label>
      <label><span data-i18n="comment"></span><textarea id="fComment" rows="3" maxlength="600"></textarea></label>
      <input type="text" id="website" tabindex="-1" autocomplete="off" aria-hidden="true" style="position:absolute;left:-9999px">
      <label class="rights" id="rightsBox" hidden><input type="checkbox" id="rights"> <span data-i18n="rights"></span></label>
      <div class="sum"><b data-i18n="summary"></b><div id="sum"></div></div>
      <button class="btn" id="send" type="submit" data-i18n="submit"></button>
      <p class="msg" id="msg" role="status"></p>
    </form>
    <div class="ok" id="ok" hidden><h3 data-i18n="ok_title"></h3><p id="okText"></p></div>
  </div>
  <div>
    <h2 class="sec" data-i18n="t_title"></h2>
    <ol class="tl" id="tl"></ol>
    <div id="info" class="info"></div>
    <h3 class="trk" data-i18n="track_title"></h3>
    <div class="track">
      <input type="text" id="tNum" maxlength="20" data-i18n-ph="track_number">
      <input type="tel" id="tPhone" maxlength="30" data-i18n-ph="track_phone">
      <button class="btn ghost" id="tBtn" data-i18n="track_btn"></button>
    </div>
    <p class="msg" id="tRes" role="status"></p>
  </div>
</div></section>

<section class="pad" id="about" hidden><div class="wrap about">
  <div><h2 class="sec" data-i18n="about_title"></h2><p id="aboutText"></p></div>
  <div><h3 data-i18n="process_title"></h3><div class="proc" id="procList"></div></div>
</div></section>

<footer>
  <div class="logo">Norm</div>
  <p id="contacts"></p>
  <p class="social">
    <a href="https://t.me/normisyou" target="_blank" rel="noopener">Telegram</a>
    <a href="https://www.tiktok.com/@norm.byazastorm" target="_blank" rel="noopener">TikTok</a>
  </p>
</footer>

<script src="/i18n.js"></script>
<script src="/intro.js"></script>
<script src="/app.js"></script>
</body>
</html>
